name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: PG ${{ matrix.pg-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg-version: [15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v4

      - name: Remove pre-existing PostgreSQL
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get remove -y 'postgresql-*' || true
          sudo rm -rf /var/lib/postgresql /etc/postgresql /var/run/postgresql

      - name: Install PostgreSQL ${{ matrix.pg-version }}
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.pg-version }} postgresql-server-dev-${{ matrix.pg-version }}

      - name: Start PostgreSQL and configure access
        run: |
          sudo pg_createcluster ${{ matrix.pg-version }} main --start || sudo pg_ctlcluster ${{ matrix.pg-version }} main start
          sudo -u postgres psql -p 5432 -c "CREATE USER runner SUPERUSER;"

      - name: Build and install extension
        run: |
          PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg-version }}/bin/pg_config
          make PG_CONFIG=$PG_CONFIG
          sudo make PG_CONFIG=$PG_CONFIG install

      - name: Run tests
        env:
          PGPORT: 5432
        run: |
          PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg-version }}/bin/pg_config
          make PG_CONFIG=$PG_CONFIG installcheck || (cat test/regression.diffs 2>/dev/null; exit 1)
