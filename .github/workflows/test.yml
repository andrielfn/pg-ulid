name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: PG ${{ matrix.pg-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg-version: [15, 16, 17]
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg-version }}
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.pg-version }} postgresql-server-dev-${{ matrix.pg-version }}

      - name: Build extension
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg-version }}/bin:$PATH"
          make

      - name: Install extension
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg-version }}/bin:$PATH"
          sudo make install

      - name: Run tests
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg-version }}/bin:$PATH"
          sudo chmod -R 777 test/
          sudo -u postgres make installcheck || (cat test/results/*.diff 2>/dev/null; exit 1)
